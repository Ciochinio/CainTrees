<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Link Tree — Cain On Games</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
      html { color-scheme: dark; }
      body { background: #020617; }
    </style>
  </head>
  <body class="h-full bg-slate-950 text-slate-200 antialiased">
    <div
      id="boot-error"
      class="hidden border-b border-amber-700/60 bg-amber-950/60 px-5 py-3 text-sm text-amber-100"
    >
      <p class="font-medium">The app's JavaScript never started — the buttons will do nothing.</p>
      <p id="boot-error-detail" class="mt-1 text-amber-200/80"></p>
    </div>

    <script>
      // Deliberately a classic script, not a module: it still runs when the
      // module fails to load at all, which is exactly when it's needed.
      window.addEventListener('DOMContentLoaded', function () {
        setTimeout(function () {
          if (window.__ytreeReady) return;
          document.getElementById('boot-error-detail').textContent =
            location.protocol === 'file:'
              ? 'This page was opened straight from disk (file://), and browsers refuse to load ES modules that way. Serve the folder instead: run "python3 -m http.server 8000" in the project directory, then open http://localhost:8000.'
              : 'src/viewer-page.js failed to load or threw while starting. Open the browser console for the actual error.';
          document.getElementById('boot-error').classList.remove('hidden');
        }, 1500);
      });
    </script>

    <div class="mx-auto flex min-h-full max-w-[1600px] flex-col lg:h-full">
      <header class="flex items-center justify-between gap-4 border-b border-slate-800 px-5 py-3">
        <div>
          <h1 class="text-base font-semibold text-slate-100">Link Tree</h1>
          <p class="text-xs text-slate-500">
            Which Cain On Games videos link to which, taken from their descriptions.
          </p>
        </div>
        <a href="./build.html" class="text-xs text-slate-500 hover:text-sky-400">Build data ↗</a>
      </header>

      <main class="flex min-w-0 flex-1 flex-col lg:overflow-hidden">
        <div class="flex flex-wrap items-center gap-2 border-b border-slate-800 px-4 py-2 text-xs">
          <div class="flex rounded-md border border-slate-700 p-0.5">
            <button id="view-list" class="rounded px-2.5 py-1 font-medium">List</button>
            <button id="view-graph" class="rounded px-2.5 py-1 font-medium">Graph</button>
          </div>
          <div id="list-tools" class="flex gap-1.5">
            <button id="expand-all" class="rounded border border-slate-700 px-2 py-1 hover:bg-slate-800">
              Expand all
            </button>
            <button id="collapse-all" class="rounded border border-slate-700 px-2 py-1 hover:bg-slate-800">
              Collapse all
            </button>
          </div>
          <div id="graph-tools" class="hidden items-center gap-1.5">
            <button id="fit" class="rounded border border-slate-700 px-2 py-1 hover:bg-slate-800">
              Fit to view
            </button>
            <button id="zoom-out" class="rounded border border-slate-700 px-2 py-1 hover:bg-slate-800" aria-label="Zoom out">
              −
            </button>
            <button id="zoom-in" class="rounded border border-slate-700 px-2 py-1 hover:bg-slate-800" aria-label="Zoom in">
              +
            </button>
          </div>
          <input
            id="search"
            type="search"
            placeholder="Search titles…"
            class="ml-auto w-40 rounded-md border border-slate-700 bg-slate-900 px-2 py-1 text-xs placeholder:text-slate-600 focus:border-sky-500 focus:outline-none sm:w-56"
          />
          <span id="status" class="text-slate-500"></span>
        </div>

        <div id="topics" class="hidden border-b border-slate-800 px-4 py-2">
          <div class="flex items-center gap-2">
            <span class="shrink-0 text-[11px] font-medium uppercase tracking-wide text-slate-500">Topics</span>
            <div id="topic-chips" class="flex flex-wrap gap-1.5"></div>
            <button id="topic-more" class="shrink-0 rounded px-1.5 py-0.5 text-xs text-slate-400 underline-offset-2 hover:text-sky-300 hover:underline">
              more
            </button>
            <button id="topic-clear" class="ml-auto hidden shrink-0 rounded px-1.5 py-0.5 text-xs text-slate-400 hover:text-slate-100">
              clear
            </button>
          </div>
        </div>

        <div
          id="crumbs"
          class="hidden flex-wrap items-center gap-1 border-b border-slate-800 px-4 py-1.5 text-xs text-slate-400"
        ></div>

        <div id="banner" class="hidden border-b border-rose-900/60 bg-rose-950/40 px-4 py-2 text-sm text-rose-200"></div>

        <div class="relative flex-1 lg:min-h-0 lg:overflow-hidden">
          <div id="list-panel" class="min-h-[70vh] p-4 lg:h-full lg:min-h-0 lg:overflow-auto"></div>
          <div id="graph-panel" class="hidden h-[70vh] cursor-grab overflow-hidden lg:h-full"></div>
          <div
            id="empty"
            class="pointer-events-none absolute inset-0 grid place-items-center p-8 text-center text-sm text-slate-600"
          >
            Loading…
          </div>
        </div>
      </main>
    </div>

    <script type="module" src="./src/viewer-page.js"></script>
  </body>
</html>
